<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音階練習</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <h1>音階練習</h1>
    <div class="profile-bar">
      <select id="profileSelect"></select>
      <button id="addProfileBtn" class="btn-icon" title="プロフィールを追加">＋</button>
      <button id="deleteProfileBtn" class="btn-icon" title="プロフィールを削除">🗑</button>
    </div>
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="practice">練習</button>
      <button class="tab-btn" data-tab="stats">記録・グラフ</button>
    </nav>
  </header>

  <main>

    <!-- ===== 練習タブ ===== -->
    <div id="tab-practice">

      <!-- 練習設定 -->
      <section class="card" id="setupCard">
        <h2>練習設定</h2>

        <div class="select-group">
          <label for="categorySelect">カテゴリーを選ぶ</label>
          <select id="categorySelect">
            <option value="first_position">第一ポジションの音階</option>
            <option value="two_octave">2オクターブの音階</option>
          </select>
        </div>

        <div class="select-group">
          <label for="scaleSelect">調を選ぶ</label>
          <select id="scaleSelect">
            <option value="">-- 選択してください --</option>
          </select>
        </div>

        <div class="select-group">
          <label>練習タイプ</label>
          <div class="radio-group">
            <label><input type="radio" name="direction" value="up" checked> ▲ 上行</label>
            <label><input type="radio" name="direction" value="down"> ▼ 下行</label>
            <label><input type="radio" name="direction" value="updown"> ▲▼ 上下</label>
            <label><input type="radio" name="direction" value="arpeggio"> 🎵 アルペジオ</label>
          </div>
        </div>

        <div class="select-group">
          <label>練習モード</label>
          <div class="radio-group">
            <label><input type="radio" name="mode" value="step" checked>1音ずつ</label>
            <label><input type="radio" name="mode" value="tempo">テンポ</label>
          </div>
        </div>

        <div class="select-group" id="bpmGroup" style="display:none">
          <label for="bpmRange">テンポ：<span id="bpmValue">60</span> BPM</label>
          <input type="range" id="bpmRange" min="40" max="120" value="60" step="4">
        </div>

        <button id="startBtn" class="btn-primary" disabled>▶ 練習開始</button>
      </section>

      <!-- 練習画面 -->
      <section class="card" id="practiceCard" style="display:none">
        <div class="mode-badge" id="modeBadge"></div>

        <div class="view-toggle">
          <button type="button" class="view-toggle-btn active" data-view="notes">🎵 音符</button>
          <button type="button" class="view-toggle-btn" data-view="fingerboard">🎻 指板</button>
        </div>

        <div class="note-staff" id="noteStaff">
          <div class="note-playhead"></div>
          <div class="note-track" id="noteTrack"></div>
        </div>

        <div class="fingerboard" id="fingerboard" style="display:none">
          <svg viewBox="0 0 240 260" class="fingerboard-svg">
            <rect x="20" y="20" width="200" height="215" rx="10" class="fb-neck"/>
            <rect x="20" y="24" width="200" height="6" class="fb-nut"/>

            <g id="fbTicks"></g>

            <line data-string="G弦" x1="45"  y1="30" x2="45"  y2="225" class="fb-string"/>
            <line data-string="D弦" x1="95"  y1="30" x2="95"  y2="225" class="fb-string"/>
            <line data-string="A弦" x1="145" y1="30" x2="145" y2="225" class="fb-string"/>
            <line data-string="E弦" x1="195" y1="30" x2="195" y2="225" class="fb-string"/>

            <text x="45"  y="14" class="fb-string-label">G</text>
            <text x="95"  y="14" class="fb-string-label">D</text>
            <text x="145" y="14" class="fb-string-label">A</text>
            <text x="195" y="14" class="fb-string-label">E</text>

            <g id="fbLandmarks"></g>

            <circle id="fingerMarker" cx="45" cy="30" r="13" class="finger-marker"/>
          </svg>
        </div>

        <div class="result-freq" id="resultFreq">周波数: -- Hz</div>
        <div class="result-status" id="resultStatus"></div>
        <div class="fingering-info" id="fingeringInfo"></div>
        <div class="countdown" id="countdown" style="display:none"></div>
        <button id="stopBtn" class="btn-secondary">■ 練習を終了</button>
      </section>

      <!-- 完了画面 -->
      <section class="card" id="completeCard" style="display:none">
        <div class="complete-icon">🎉</div>
        <h2>完了！</h2>
        <p id="completeMsg"></p>
        <div class="accuracy-display" id="accuracyDisplay" style="display:none">
          <div class="accuracy-num" id="accuracyNum"></div>
          <div class="accuracy-label">正答率</div>
        </div>
        <button id="retryBtn" class="btn-primary">戻る</button>
      </section>

      <!-- 練習履歴 -->
      <section class="card">
        <h2>練習履歴</h2>
        <ul class="history-list" id="historyList">
          <li class="history-empty">まだ履歴がありません</li>
        </ul>
      </section>

    </div>

    <!-- ===== 記録・グラフタブ ===== -->
    <div id="tab-stats" style="display:none">

      <section class="card">
        <h2>📈 正答率の推移</h2>
        <canvas id="chartAccuracy"></canvas>
      </section>

      <section class="card">
        <h2>📅 練習回数（日別）</h2>
        <canvas id="chartDaily"></canvas>
      </section>

      <section class="card">
        <h2>🎼 調ごとの正答率</h2>
        <canvas id="chartScale"></canvas>
      </section>

      <button id="clearStatsBtn" class="btn-danger btn-sm">履歴を消去</button>

    </div>

  </main>

  <script src="{{ url_for('static', filename='js/pitch.js') }}"></script>
  <script src="{{ url_for('static', filename='js/storage.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
